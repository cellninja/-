<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Ninja | Assistência Técnica Especializada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header-bg {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        .logo-container img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #fff;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }
        .header-bg h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .header-bg p {
            font-size: 0.95rem;
            color: #bdc3c7;
        }
        .content {
            padding: 25px 20px;
        }
        .badge-box {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 25px;
            text-align: center;
        }
        .badge-item h4 {
            font-size: 0.85rem;
            color: #27ae60;
            margin-bottom: 2px;
        }
        .badge-item span {
            font-size: 0.78rem;
            color: #666;
        }
        .section-title {
            font-size: 1.05rem;
            color: #2c3e50;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            border-left: 4px solid #6b1d2f;
            padding-left: 10px;
        }
        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        .service-card {
            background: #fff;
            border: 1px solid #eef2f5;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .service-card:hover {
            transform: translateY(-2px);
            border-color: #d1d8e0;
        }
        .service-card h3 {
            font-size: 0.98rem;
            color: #2c3e50;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .service-card h3 span {
            color: #6b1d2f;
        }
        .service-card p {
            font-size: 0.85rem;
            color: #666;
        }
        .about-section {
            background: #fcfcfc;
            border-left: 3px solid #3498db;
            padding: 15px;
            border-radius: 0 10px 10px 0;
            font-size: 0.88rem;
            color: #555;
            margin-bottom: 25px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-whatsapp {

            color: white;

            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #fd1d1d, #fd8f3f);
            color: white;
        }
